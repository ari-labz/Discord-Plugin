# Builds discord.ari and attaches it to the release.
name: Release
# Manual for now: the build needs ARI's plugin host support, which is not on GitHub yet. Switch this back to
#   on: { push: { tags: ["v*"] } }
# once it is, and the workflow will build a release from every version tag.
on:
  workflow_dispatch:
jobs:
  release:
    uses: ari-labz/A.R.I-Plugins/.github/workflows/release-plugin.yml@main
    permissions: { contents: write }
    with:
      id: discord
      name: Discord
      description: "Reads and replies to messages in Discord servers and DMs, and joins voice channels."
      author: first-party
      project: ARI.Plugin.Discord.csproj
      entry: ARI.Plugin.Discord.dll
